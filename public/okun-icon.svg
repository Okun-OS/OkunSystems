<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="g" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1040b8"/>
      <stop offset="55%" stop-color="#0090d8"/>
      <stop offset="100%" stop-color="#00c8ff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="48" height="48" rx="10" fill="#080c14"/>
  <g filter="url(#glow)">
    <!-- Circle arc center (24,24) r=17, gap 40° on left: 160°–200° -->
    <!-- 160°: x=24+17·cos(160°)=24-15.97=8.03, y=24+17·sin(160°)=24+5.81=29.81 -->
    <!-- 200°: x=8.03, y=24-5.81=18.19 -->
    <path d="M 8.03 18.19 A 17 17 0 1 1 8.03 29.81" stroke="url(#g)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="1" y1="24" x2="24" y2="24" stroke="url(#g)" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="24" cy="24" r="2.8" fill="#00c8ff"/>
  </g>
</svg>
