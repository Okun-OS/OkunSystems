[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = [
  "npx prisma generate",
  "node -e \"require('fs').writeFileSync('src/generated/prisma/index.ts', \\\"export * from './client';\\\\n\\\")\"",
  "npm run build"
]

[start]
cmd = "npx prisma db push --accept-data-loss && npx tsx prisma/seed.ts && npx tsx prisma/seed-library.ts && npm start"
