[phases.setup]
nixPkgs = ["nodejs_22", "chromium", "nss", "nspr", "atk", "cups", "dbus", "expat", "libdrm", "libxkbcommon", "mesa", "xorg.libX11", "xorg.libXcomposite", "xorg.libXdamage", "xorg.libXext", "xorg.libXfixes", "xorg.libXrandr", "xorg.libxcb"]

[variables]
PUPPETEER_SKIP_DOWNLOAD = "true"

[phases.install]
cmds = ["PUPPETEER_SKIP_DOWNLOAD=true npm ci"]

[phases.build]
cmds = [
  "npx prisma generate",
  "node -e \"require('fs').writeFileSync('src/generated/prisma/index.ts', \\\"export * from './client';\\\\n\\\")\"",
  "npm run build"
]

[start]
cmd = "npx prisma db push --accept-data-loss && (npx tsx prisma/seed.ts || echo \"WARNUNG: prisma/seed.ts fehlgeschlagen - Start wird fortgesetzt\") && (npx tsx prisma/seed-library.ts || echo \"WARNUNG: prisma/seed-library.ts fehlgeschlagen - Start wird fortgesetzt\") && (npx tsx prisma/seed-questions.ts || echo \"WARNUNG: prisma/seed-questions.ts fehlgeschlagen - Start wird fortgesetzt\") && (npx tsx prisma/seed-blueprint.ts || echo \"WARNUNG: prisma/seed-blueprint.ts fehlgeschlagen - Start wird fortgesetzt\") && (npx tsx prisma/seed-closing.ts || echo \"WARNUNG: prisma/seed-closing.ts fehlgeschlagen - Start wird fortgesetzt\") && npm start"
